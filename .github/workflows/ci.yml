name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: emails/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage
          npm ci --prefix emails

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s execution -p 'test_*.py'
          coverage report --fail-under=80 \
            --include='execution/url_dedup.py,execution/feed_ingest.py,execution/mailer.py,execution/llm_fixtures.py,execution/design_tokens.py,execution/check_digest_heartbeat.py'

      - name: Email render smoke
        run: |
          node emails/render_email.mjs execution/fixtures/email_smoke_payload.json > /tmp/email.html
          grep -q "Smoke story" /tmp/email.html

      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
