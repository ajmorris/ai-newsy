name: Prepare Community Headlines

on:
  schedule:
    # 2:00 AM America/New_York (covers EST and EDT candidate UTC slots)
    - cron: '0 7 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: prepare-community-headlines-schedule
  cancel-in-progress: false
jobs:
  prepare-community-headlines:
    runs-on: ubuntu-latest

    steps:
      - name: Guard scheduled run to 2:00 AM America/New_York
        id: guard
        run: |
          should_run="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run="true"
            echo "Guard: proceeding (workflow_dispatch)."
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ny_hour=$(TZ=America/New_York date +'%H')
            echo "Current America/New_York hour: ${ny_hour}"
            if [ "${ny_hour}" = "02" ]; then
              should_run="true"
              echo "Guard: proceeding (scheduled hour ${ny_hour})."
            else
              echo "Guard: skipping later steps (scheduled hour ${ny_hour}, want 02)."
            fi
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Claude CLI
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: ./.github/actions/setup-claude-cli

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Reddit/HN/YC headlines
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER_CHAIN: claude_code
          CLAUDE_CODE_MODEL: ${{ vars.COMMUNITY_HEADLINES_CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          CLAUDE_CODE_TIMEOUT_SECONDS: ${{ vars.CLAUDE_CODE_TIMEOUT_SECONDS || '600' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-6' }}
          COMMUNITY_LOOKBACK_HOURS: ${{ vars.COMMUNITY_LOOKBACK_HOURS || '24' }}
          COMMUNITY_FETCH_LIMIT: ${{ vars.COMMUNITY_FETCH_LIMIT || '120' }}
          COMMUNITY_MAX_HEADLINES: ${{ vars.COMMUNITY_MAX_HEADLINES || '24' }}
          COMMUNITY_HEADLINES_MODEL: ${{ vars.COMMUNITY_HEADLINES_MODEL || 'gemini-2.0-flash' }}
          COMMUNITY_MIN_LEARNING_SCORE: ${{ vars.COMMUNITY_MIN_LEARNING_SCORE || '2' }}
          COMMUNITY_THEME_SIMILARITY_THRESHOLD: ${{ vars.COMMUNITY_THEME_SIMILARITY_THRESHOLD || '0.38' }}
          COMMUNITY_MAX_PER_THEME: ${{ vars.COMMUNITY_MAX_PER_THEME || '2' }}
          COMMUNITY_DISTINCTNESS_THRESHOLD: ${{ vars.COMMUNITY_DISTINCTNESS_THRESHOLD || '0.45' }}
          COMMUNITY_SUBREDDITS: ${{ vars.COMMUNITY_SUBREDDITS || 'MachineLearning,artificial,LocalLLaMA,OpenAI,singularity' }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'ai-newsy-digest/1.0 (+https://github.com/ajmorris/ai-newsy)' }}
          YC_RSS_URL: ${{ vars.YC_RSS_URL || 'https://www.ycombinator.com/blog/feed' }}
        run: python execution/generate_community_headlines.py

      - name: Verify community headlines payload
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from execution.database import get_digest_extra

          digest_date = datetime.utcnow().date().isoformat()
          extra = get_digest_extra(digest_date=digest_date, key="community_headlines")
          payload = extra.get("payload", {}) if isinstance(extra, dict) else {}
          headlines = payload.get("headlines", []) if isinstance(payload, dict) else []
          print(
              f"community_headlines verification for {digest_date}: "
              f"source_count={payload.get('source_count', 0)}, headline_count={len(headlines)}"
          )
          PY
