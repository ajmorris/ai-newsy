name: Prepare RSS Content

on:
  schedule:
    # 2:00 AM America/New_York (covers EST and EDT candidate UTC slots)
    - cron: '0 7 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-rss-content-schedule
  cancel-in-progress: false

jobs:
  prepare-content:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Guard scheduled run to 2:00 AM America/New_York
        id: guard
        run: |
          should_run="true"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ny_time=$(TZ=America/New_York date +'%H:%M')
            echo "Current America/New_York time: ${ny_time}"
            if [ "${ny_time}" != "02:00" ]; then
              echo "Outside target local time; skipping later steps."
              should_run="false"
            fi
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch AI News from RSS
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python execution/fetch_ai_news.py --limit 10

      - name: Single-pass analyze new articles
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          PROMPT_SINGLE_PASS_ANALYSIS: ${{ vars.PROMPT_SINGLE_PASS_ANALYSIS }}
          SINGLE_PASS_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: python execution/analyze_articles_single_pass.py

      - name: Generate tweet headlines and persist
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TWEETS_DATABASE_ID: ${{ secrets.NOTION_TWEETS_DATABASE_ID }}
          TWEET_LOOKBACK_HOURS: ${{ vars.TWEET_LOOKBACK_HOURS || '24' }}
          TWEET_FETCH_LIMIT: ${{ vars.TWEET_FETCH_LIMIT || '100' }}
          TWEET_MAX_HEADLINES: ${{ vars.TWEET_MAX_HEADLINES || '36' }}
        run: python execution/generate_tweet_headlines.py

      - name: Generate community headlines and persist
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          COMMUNITY_LOOKBACK_HOURS: ${{ vars.COMMUNITY_LOOKBACK_HOURS || '24' }}
          COMMUNITY_FETCH_LIMIT: ${{ vars.COMMUNITY_FETCH_LIMIT || '120' }}
          COMMUNITY_MAX_HEADLINES: ${{ vars.COMMUNITY_MAX_HEADLINES || '24' }}
          COMMUNITY_SUBREDDITS: ${{ vars.COMMUNITY_SUBREDDITS || 'MachineLearning,artificial,LocalLLaMA,OpenAI,singularity' }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'ai-newsy-digest/1.0 (+https://github.com/ajmorris/ai-newsy)' }}
          YC_RSS_URL: ${{ vars.YC_RSS_URL || 'https://www.ycombinator.com/blog/feed' }}
        run: python execution/generate_community_headlines.py

      - name: Verify RSS summaries available for digest
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from execution.database import get_unsent_articles, get_articles_without_analysis

          since = datetime.utcnow() - timedelta(hours=24)
          rows = get_unsent_articles(topic=None, require_summary=True, since=since, until=None)
          pending = get_articles_without_analysis()
          print(f"rss verification: summarized_unsent_last_24h={len(rows)}")
          print(f"rss verification: pending_single_pass_articles={len(pending)}")
          PY

      - name: Build canonical digest payload JSON
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          PROMPT_INTRO: ${{ vars.PROMPT_INTRO }}
        run: python execution/digest_payload.py

      - name: Commit canonical digest payload updates
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          git add data/digests/*.json
          if git diff --staged --quiet; then
            echo "No canonical digest JSON changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist canonical digest payload"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload prepare-step digest markdown artifacts
        if: ${{ always() && steps.guard.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: prepare-digest-markdown-${{ github.run_id }}
          path: |
            data/digests/*.md
            data/digests/*.json
          if-no-files-found: ignore
