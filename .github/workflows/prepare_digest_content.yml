name: Prepare RSS Content

on:
  schedule:
    # 2:00 AM America/New_York (covers EST and EDT candidate UTC slots)
    - cron: '0 7 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-rss-content-schedule
  cancel-in-progress: false

jobs:
  prepare-content:
    runs-on: ubuntu-latest

    steps:
      - name: Guard scheduled run to 2:00 AM America/New_York
        id: guard
        run: |
          should_run="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run="true"
            echo "Guard: proceeding (workflow_dispatch)."
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ny_hour=$(TZ=America/New_York date +'%H')
            echo "Current America/New_York hour: ${ny_hour}"
            if [ "${ny_hour}" = "02" ]; then
              should_run="true"
              echo "Guard: proceeding (scheduled hour ${ny_hour})."
            else
              echo "Guard: skipping later steps (scheduled hour ${ny_hour}, want 02)."
            fi
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Claude CLI
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: ./.github/actions/setup-claude-cli

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch AI News from RSS
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python execution/fetch_ai_news.py --limit 10

      - name: Single-pass analyze new articles
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER_CHAIN: claude_code
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-6' }}
          PROMPT_SINGLE_PASS_ANALYSIS: ${{ vars.PROMPT_SINGLE_PASS_ANALYSIS }}
          SINGLE_PASS_MODEL: ${{ vars.SINGLE_PASS_MODEL || 'gemini-2.0-flash' }}
          SINGLE_PASS_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -u execution/analyze_articles_single_pass.py

      - name: Verify RSS summaries available for digest
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from execution.database import get_unsent_articles, get_articles_without_analysis

          since = datetime.utcnow() - timedelta(hours=24)
          rows = get_unsent_articles(topic=None, require_summary=True, since=since, until=None)
          pending = get_articles_without_analysis()
          print(f"rss verification: summarized_unsent_last_24h={len(rows)}")
          print(f"rss verification: pending_single_pass_articles={len(pending)}")
          PY

      - name: Upload prepare-step digest markdown artifacts
        if: ${{ always() && steps.guard.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: prepare-digest-markdown-${{ github.run_id }}
          path: |
            data/digests/*.md
            data/digests/*.json
          if-no-files-found: ignore
