name: Finalize Digest Payload

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-digest-payload-schedule
  cancel-in-progress: false

jobs:
  finalize-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Claude CLI
        uses: ./.github/actions/setup-claude-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build canonical digest payload JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER_CHAIN: claude_code
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-6' }}
          PROMPT_INTRO: ${{ vars.PROMPT_INTRO }}
        run: python execution/digest_payload.py

      - name: Verify payload intro and opinions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from execution.digest_payload import assert_digest_stories_have_opinions, load_digest_payload

          digest_date = datetime.utcnow().date().isoformat()
          payload = load_digest_payload(digest_date=digest_date)
          if not payload:
              raise SystemExit(f"Canonical digest payload missing for {digest_date}")
          intro = str(payload.get("intro") or "").strip()
          if not intro:
              raise SystemExit(f"Digest intro is empty for {digest_date}")
          stories = list(payload.get("stories") or [])
          assert_digest_stories_have_opinions(stories)
          print(
              f"finalize verification for {digest_date}: "
              f"stories={len(stories)}, "
              f"tweet_headlines={len(payload.get('tweet_headlines') or [])}, "
              f"community_headlines={len(payload.get('community_headlines') or [])}"
          )
          PY

      - name: Commit canonical digest payload updates
        run: |
          git add data/digests/*.json
          if git diff --staged --quiet; then
            echo "No canonical digest JSON changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist canonical digest payload"
          git push origin "HEAD:${{ github.ref_name }}"
