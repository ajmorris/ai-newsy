name: Finalize Digest Payload

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finalize-digest-payload-schedule
  cancel-in-progress: false

jobs:
  finalize-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Require digest push token
        env:
          DIGEST_PUSH_TOKEN: ${{ secrets.DIGEST_PUSH_TOKEN }}
        run: |
          if [ -z "${DIGEST_PUSH_TOKEN}" ]; then
            echo "Repository secret DIGEST_PUSH_TOKEN is missing."
            echo "Create a fine-grained PAT for ajmorris with Contents read and write on this repository,"
            echo "store it as DIGEST_PUSH_TOKEN, and add ajmorris to the CI ruleset bypass list (Always allow)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DIGEST_PUSH_TOKEN }}

      - name: Set up Claude CLI
        uses: ./.github/actions/setup-claude-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build canonical digest payload JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER_CHAIN: claude_code
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-6' }}
          PROMPT_INTRO: ${{ vars.PROMPT_INTRO }}
        run: python execution/digest_payload.py

      - name: Verify payload intro and opinions
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          digest_date = datetime.utcnow().date().isoformat()
          path = Path("data/digests") / f"{digest_date}.json"
          if not path.exists():
              raise SystemExit(f"Canonical digest payload missing for {digest_date}")
          payload = json.loads(path.read_text(encoding="utf-8"))
          intro = str(payload.get("intro") or "").strip()
          if not intro:
              raise SystemExit(f"Digest intro is empty for {digest_date}")
          stories = list(payload.get("stories") or [])
          missing = [
              story.get("id", story.get("title", "unknown"))
              for story in stories
              if not str(story.get("opinion", "") or "").strip()
          ]
          if missing:
              raise SystemExit(
                  "Digest invariant failed: every story must have a non-empty opinion "
                  f"(Why it matters). Missing for: {missing!r}"
              )
          print(
              f"finalize verification for {digest_date}: "
              f"stories={len(stories)}, "
              f"tweet_headlines={len(payload.get('tweet_headlines') or [])}, "
              f"community_headlines={len(payload.get('community_headlines') or [])}"
          )
          PY

      - name: Note today's digest date
        id: digest_date
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload canonical digest payload
        uses: actions/upload-artifact@v4
        with:
          name: canonical-digest
          path: data/digests/${{ steps.digest_date.outputs.value }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Copy the issue to Cloudflare when configured
        if: ${{ vars.CLOUDFLARE_PUBLISH_URL != '' }}
        env:
          CLOUDFLARE_PUBLISH_URL: ${{ vars.CLOUDFLARE_PUBLISH_URL }}
          CLOUDFLARE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_PUBLISH_TOKEN }}
        run: python execution/publish_issue.py --digest-date "$(date -u +%F)"
