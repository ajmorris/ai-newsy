name: Finalize Digest Payload

on:
  schedule:
    # 4:00 AM America/New_York (covers EST and EDT candidate UTC slots)
    - cron: '0 9 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-digest-payload-schedule
  cancel-in-progress: false

jobs:
  finalize-payload:
    runs-on: ubuntu-latest

    steps:
      - name: Guard scheduled run to 4:00 AM America/New_York
        id: guard
        run: |
          should_run="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_run="true"
            echo "Guard: proceeding (workflow_dispatch)."
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ny_hour=$(TZ=America/New_York date +'%H')
            echo "Current America/New_York hour: ${ny_hour}"
            if [ "${ny_hour}" = "04" ]; then
              should_run="true"
              echo "Guard: proceeding (scheduled hour ${ny_hour})."
            else
              echo "Guard: skipping later steps (scheduled hour ${ny_hour}, want 04)."
            fi
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Claude CLI
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: ./.github/actions/setup-claude-cli

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build canonical digest payload JSON
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER_CHAIN: claude_code
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-6' }}
          PROMPT_INTRO: ${{ vars.PROMPT_INTRO }}
        run: python execution/digest_payload.py

      - name: Verify payload intro and opinions
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from execution.digest_payload import assert_digest_stories_have_opinions, load_digest_payload

          digest_date = datetime.utcnow().date().isoformat()
          payload = load_digest_payload(digest_date=digest_date)
          if not payload:
              raise SystemExit(f"Canonical digest payload missing for {digest_date}")
          intro = str(payload.get("intro") or "").strip()
          if not intro:
              raise SystemExit(f"Digest intro is empty for {digest_date}")
          stories = list(payload.get("stories") or [])
          assert_digest_stories_have_opinions(stories)
          print(
              f"finalize verification for {digest_date}: "
              f"stories={len(stories)}, "
              f"tweet_headlines={len(payload.get('tweet_headlines') or [])}, "
              f"community_headlines={len(payload.get('community_headlines') or [])}"
          )
          PY

      - name: Commit canonical digest payload updates
        if: ${{ steps.guard.outputs.should_run == 'true' }}
        run: |
          git add data/digests/*.json
          if git diff --staged --quiet; then
            echo "No canonical digest JSON changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist canonical digest payload"
          git push origin "HEAD:${{ github.ref_name }}"
