# Daily AI Digest Workflow
# Compiles finalized JSON into markdown/HTML and sends via Resend.
# Production sends are invoked by digest_pipeline.yml after Finalize commits
# data/digests/YYYY-MM-DD.json. Manual dispatch still requires force_send.

name: Daily AI Digest

on:
  workflow_call:
    inputs:
      force_send:
        description: "Allow production send (bypasses duplicate-send guard)"
        required: false
        type: boolean
        default: false
      send_reason:
        description: "Reason for production send override"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      force_send:
        description: "Allow manual production send (bypasses duplicate-send guard)"
        required: false
        type: boolean
        default: false
      send_reason:
        description: "Reason for manual production send override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-digest-schedule
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Checkout first so the shared Python guard can run. Later steps still
      # gate on should_send so blocked manual runs skip install/send.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Decide once whether this run should proceed past setup. Setting an output
      # (instead of `exit 0`) lets every later step gate on `steps.guard.outputs.should_send`.
      # Reusable workflows inherit the caller's event name: digest_pipeline cron
      # arrives here as schedule (not workflow_call). Both are pipeline sends.
      # Manual dispatch still requires force_send. The DB claim in
      # send_daily_email.py is the second, durable layer that catches anything
      # this guard misses. schedule + should_send=false exits non-zero so a
      # silent no-op cannot look green.
      - name: Guard run (pipeline + manual override)
        id: guard
        run: |
          python3 execution/digest_send_guard.py \
            --event-name "${{ github.event_name }}" \
            --force-send "${{ inputs.force_send }}"

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: emails/package-lock.json

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix emails

      - name: Validate email link origin env
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL secret is required for confirmation/unsubscribe links."
            exit 1
          fi
          if [ "${APP_URL}" = "https://your-app.vercel.app" ]; then
            echo "APP_URL secret is still set to placeholder value."
            exit 1
          fi

      - name: Require canonical digest payload
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          expected_payload="data/digests/$(date -u +%F).json"
          echo "Looking for canonical payload: ${expected_payload}"
          git fetch origin "${{ github.ref_name }}"
          if git checkout "origin/${{ github.ref_name }}" -- "${expected_payload}"; then
            echo "Found ${expected_payload}."
            exit 0
          fi
          echo "Missing canonical digest payload for today."
          ls -la data/digests || true
          exit 1

      - name: Send daily email digest
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python execution/build_digest_markdown.py
          FORCE_SEND_FLAG=""
          if [ "${{ inputs.force_send }}" = "true" ]; then
            FORCE_SEND_FLAG="--force-send"
          fi
          SEND_REASON="${{ inputs.send_reason || '' }}"
          python execution/send_daily_email.py ${FORCE_SEND_FLAG} --send-reason "${SEND_REASON}"

      - name: Verify send produced today's sent snapshot
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          expected_snapshot="data/digests/snapshots/$(date -u +%F).sent.json"
          echo "Checking for expected snapshot: ${expected_snapshot}"
          if [ ! -f "${expected_snapshot}" ]; then
            echo "Missing sent snapshot for today."
            ls -la data/digests/snapshots || true
            exit 1
          fi

      - name: Commit sent snapshots
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          # Persist what was emailed. Do not rebuild frontend/issues here.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/digests/snapshots
          shopt -s nullglob
          snapshot_files=(data/digests/snapshots/*.sent.json data/digests/snapshots/*.status.json)
          if [ ${#snapshot_files[@]} -eq 0 ]; then
            echo "No sent snapshots to commit."
            exit 0
          fi
          git add "${snapshot_files[@]}"
          if git diff --staged --quiet; then
            echo "No sent snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: persist sent digest snapshots"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload digest artifacts
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-artifacts-${{ github.run_id }}
          path: |
            data/digests/*.md
            data/digests/*.json
            data/digests/snapshots/*.sent.json
            data/digests/snapshots/*.status.json
          if-no-files-found: error
