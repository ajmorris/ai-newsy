# Daily AI Digest send
# Prefers today's committed canonical JSON (local Claude pipeline).
# If that JSON is missing or incomplete, GitHub Actions generates it with
# Claude Opus 5 so the scheduled email still goes out.

name: Daily AI Digest

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: "Allow manual production send (bypasses duplicate-send guard)"
        required: false
        type: boolean
        default: false
      send_reason:
        description: "Reason for manual production send override"
        required: false
        type: string

concurrency:
  group: daily-ai-digest-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Guard run (time window + manual override)
        id: guard
        run: |
          should_send="false"
          reason=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            should_send="true"
            reason="Scheduled run at fixed UTC cadence."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_send }}" = "true" ]; then
              should_send="true"
            else
              reason="Manual run blocked unless force_send=true."
            fi
          else
            reason="Unsupported event: ${{ github.event_name }}."
          fi

          if [ "${should_send}" = "true" ]; then
            echo "Guard: proceeding with send. Reason: ${reason}"
          else
            echo "Guard: skipping later steps. Reason: ${reason}"
          fi
          echo "should_send=${should_send}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: emails/package-lock.json

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix emails

      - name: Validate email link origin env
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL secret is required for confirmation/unsubscribe links."
            exit 1
          fi
          if [ "${APP_URL}" = "https://your-app.vercel.app" ]; then
            echo "APP_URL secret is still set to placeholder value."
            exit 1
          fi

      - name: Inspect committed canonical digest
        id: canonical
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: python execution/digest_payload.py --inspect

      - name: Validate Anthropic key for CI generation
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        run: |
          if [ -z "${ANTHROPIC_KEY}" ]; then
            echo "Today's canonical digest is missing (reason=${{ steps.canonical.outputs.reason }})."
            echo "ANTHROPIC_KEY is required for GitHub Actions to generate it so the email can still send."
            exit 1
          fi

      - name: Fetch AI News from RSS
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python execution/fetch_ai_news.py --limit 10

      - name: Single-pass analyze new articles
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          PROMPT_SINGLE_PASS_ANALYSIS: ${{ vars.PROMPT_SINGLE_PASS_ANALYSIS }}
          SINGLE_PASS_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: python execution/analyze_articles_single_pass.py

      - name: Generate tweet headlines and persist
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TWEETS_DATABASE_ID: ${{ secrets.NOTION_TWEETS_DATABASE_ID }}
          TWEET_LOOKBACK_HOURS: ${{ vars.TWEET_LOOKBACK_HOURS || '24' }}
          TWEET_FETCH_LIMIT: ${{ vars.TWEET_FETCH_LIMIT || '100' }}
          TWEET_MAX_HEADLINES: ${{ vars.TWEET_MAX_HEADLINES || '36' }}
        run: python execution/generate_tweet_headlines.py

      - name: Generate community headlines and persist
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          COMMUNITY_LOOKBACK_HOURS: ${{ vars.COMMUNITY_LOOKBACK_HOURS || '24' }}
          COMMUNITY_FETCH_LIMIT: ${{ vars.COMMUNITY_FETCH_LIMIT || '120' }}
          COMMUNITY_MAX_HEADLINES: ${{ vars.COMMUNITY_MAX_HEADLINES || '24' }}
          COMMUNITY_SUBREDDITS: ${{ vars.COMMUNITY_SUBREDDITS || 'MachineLearning,artificial,LocalLLaMA,OpenAI,singularity' }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'ai-newsy-digest/1.0 (+https://github.com/ajmorris/ai-newsy)' }}
          YC_RSS_URL: ${{ vars.YC_RSS_URL || 'https://www.ycombinator.com/blog/feed' }}
        run: python execution/generate_community_headlines.py

      - name: Build canonical digest payload JSON
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          PROMPT_INTRO: ${{ vars.PROMPT_INTRO }}
        run: |
          python execution/digest_payload.py
          python execution/build_digest_markdown.py

      - name: Commit generated canonical digest
        if: ${{ steps.guard.outputs.should_send == 'true' && steps.canonical.outputs.needs_generate == 'true' }}
        run: |
          git add data/digests/*.json
          if git diff --staged --quiet; then
            echo "No canonical digest JSON changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist canonical digest payload"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Confirm canonical digest is ready to send
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from execution.digest_payload import inspect_canonical_digest

          digest_date = datetime.now(timezone.utc).date().isoformat()
          status = inspect_canonical_digest(digest_date=digest_date)
          print(
              f"Canonical digest {digest_date}: ok={status['ok']} "
              f"reason={status['reason']} stories={status['story_count']}"
          )
          if not status["ok"]:
              raise SystemExit(
                  f"Canonical digest still not sendable after generation "
                  f"(reason={status['reason']})."
              )
          PY

      - name: Send daily email digest
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          FORCE_SEND_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_send }}" = "true" ]; then
            FORCE_SEND_FLAG="--force-send"
          fi
          SEND_REASON="${{ inputs.send_reason || '' }}"
          python execution/send_daily_email.py --no-llm ${FORCE_SEND_FLAG} --send-reason "${SEND_REASON}"

      - name: Verify scheduled run produced today's sent snapshot
        if: ${{ github.event_name == 'schedule' && steps.guard.outputs.should_send == 'true' }}
        run: |
          expected_snapshot="data/digests/snapshots/$(date -u +%F).sent.json"
          echo "Checking for expected snapshot: ${expected_snapshot}"
          if [ ! -f "${expected_snapshot}" ]; then
            echo "Missing scheduled snapshot for today."
            ls -la data/digests/snapshots || true
            exit 1
          fi

      - name: Upload digest artifacts
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-artifacts-${{ github.run_id }}
          path: |
            data/digests/*.md
            data/digests/*.json
            data/digests/snapshots/*.sent.json
            data/digests/snapshots/*.status.json
          if-no-files-found: error
