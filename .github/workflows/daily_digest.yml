# Daily AI Digest Workflow
# Compiles finalized JSON into markdown/HTML and sends via Resend.
# Production sends are invoked by digest_pipeline.yml with pipeline_run=true.
# The email is sent from the finalized JSON artifact. Saving that file on main
# happens after the send, so a pull-request failure cannot block the email.
# A direct manual dispatch of this workflow still requires force_send.

name: Daily AI Digest

on:
  workflow_call:
    inputs:
      force_send:
        description: "Allow production send (bypasses duplicate-send guard)"
        required: false
        type: boolean
        default: false
      send_reason:
        description: "Reason for production send override"
        required: false
        type: string
        default: ""
      pipeline_run:
        description: "Called by the daily digest pipeline (does not bypass the duplicate-send claim)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_send:
        description: "Allow manual production send (bypasses duplicate-send guard)"
        required: false
        type: boolean
        default: false
      send_reason:
        description: "Reason for manual production send override"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: daily-ai-digest-schedule
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout first so the shared Python guard can run. Later steps still
      # gate on should_send so blocked manual runs skip install/send.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Decide once whether this run should proceed past setup. Setting an output
      # (instead of `exit 0`) lets every later step gate on `steps.guard.outputs.should_send`.
      # Reusable workflows inherit the caller's event name: digest_pipeline cron
      # arrives here as schedule (not workflow_call). Both are pipeline sends.
      # Manual dispatch still requires force_send. The DB claim in
      # send_daily_email.py is the second, durable layer that catches anything
      # this guard misses. schedule + should_send=false exits non-zero so a
      # silent no-op cannot look green.
      - name: Guard run (pipeline + manual override)
        id: guard
        run: |
          python3 execution/digest_send_guard.py \
            --event-name "${{ github.event_name }}" \
            --force-send "${{ inputs.force_send }}" \
            --pipeline-run "${{ inputs.pipeline_run }}"

      - name: Set up Python
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: emails/package-lock.json

      - name: Install dependencies
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix emails

      - name: Validate email link origin env
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL secret is required for confirmation/unsubscribe links."
            exit 1
          fi
          if [ "${APP_URL}" = "https://your-app.vercel.app" ]; then
            echo "APP_URL secret is still set to placeholder value."
            exit 1
          fi

      - name: Download canonical digest payload
        if: ${{ inputs.pipeline_run && steps.guard.outputs.should_send == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: canonical-digest
          path: data/digests

      - name: Require canonical digest payload
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          expected_payload="data/digests/$(date -u +%F).json"
          echo "Looking for canonical payload: ${expected_payload}"
          if [ -f "${expected_payload}" ]; then
            echo "Using ${expected_payload} from this run."
            exit 0
          fi
          git fetch origin "${{ github.ref_name }}"
          if git checkout "origin/${{ github.ref_name }}" -- "${expected_payload}"; then
            echo "Found ${expected_payload} on ${{ github.ref_name }}."
            exit 0
          fi
          echo "Missing canonical digest payload for today."
          ls -la data/digests || true
          exit 1

      - name: Send daily email digest
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Compile markdown from the finalized JSON already checked out above.
          # Do not pass --rebuild; that would regenerate from current DB state.
          python execution/build_digest_markdown.py --digest-date "$(date -u +%F)"
          FORCE_SEND_FLAG=""
          if [ "${{ inputs.force_send }}" = "true" ]; then
            FORCE_SEND_FLAG="--force-send"
          fi
          SEND_REASON="${{ inputs.send_reason || '' }}"
          python execution/send_daily_email.py ${FORCE_SEND_FLAG} --send-reason "${SEND_REASON}"

      - name: Verify send produced today's sent snapshot
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        run: |
          expected_snapshot="data/digests/snapshots/$(date -u +%F).sent.json"
          echo "Checking for expected snapshot: ${expected_snapshot}"
          if [ ! -f "${expected_snapshot}" ]; then
            status_file="data/digests/snapshots/$(date -u +%F).status.json"
            if [ -f "${status_file}" ] && grep -q "duplicate_prevented" "${status_file}"; then
              echo "Digest was already sent. Saving the payload without sending again."
              exit 0
            fi
            echo "Missing sent snapshot for today."
            ls -la data/digests/snapshots || true
            exit 1
          fi

      - name: Commit sent snapshots
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The email has already been sent. This only saves the record on main.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          digest_date="$(date -u +%F)"
          mkdir -p data/digests/snapshots
          shopt -s nullglob
          snapshot_files=(data/digests/snapshots/*.sent.json data/digests/snapshots/*.status.json)
          if [ -f "data/digests/${digest_date}.json" ]; then
            git add "data/digests/${digest_date}.json"
          fi
          if [ ${#snapshot_files[@]} -gt 0 ]; then
            git add "${snapshot_files[@]}"
          fi
          if git diff --staged --quiet; then
            echo "No digest files to commit."
            exit 0
          fi
          git commit -m "chore: persist sent digest for ${digest_date}"
          if ! python execution/open_automerge_pr.py \
            --branch "automation/snapshot-${{ github.run_id }}" \
            --base "${{ github.ref_name }}" \
            --title "chore: persist sent digest for ${digest_date}"; then
            echo "::error::The email was already sent. Saving the digest on main failed."
            {
              echo "## Email sent, files not saved"
              echo "Subscribers already received today's digest."
              echo "Turn on **Allow GitHub Actions to create and approve pull requests** under Settings → Actions → General → Workflow permissions, then run the pipeline again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload digest artifacts
        if: ${{ steps.guard.outputs.should_send == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-artifacts-${{ github.run_id }}
          path: |
            data/digests/*.md
            data/digests/*.json
            data/digests/snapshots/*.sent.json
            data/digests/snapshots/*.status.json
          if-no-files-found: error
